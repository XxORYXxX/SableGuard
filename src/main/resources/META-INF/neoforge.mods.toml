# This is the mods.toml file for SableGuard. Placeholders are expanded from gradle.properties
# by the ProcessResources task in build.gradle.
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

# Targets in mods whose source SableGuard could not check (Create ThreadedTrains, Scorched Guns, Create: The Air Wars: checked against its 5.00 bytecode only, Sable Dynamic Lights: checked against its 2.0.1 bytecode only, Sable Heavy Blocks: checked against its 1.0.5 bytecode only, CBC Ballistics: checked against its 1.3.0a bytecode only) or whose internals change often (CarryOn).
# Not required: if one of those mods changed, the affected mixin is skipped with an error in the log.
[[mixins]]
config="${mod_id}.thirdparty.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Load after Sable so Sable's own mixins/classes are set up first.
[[dependencies.${mod_id}]]
    modId="sable"
    type="required"
    versionRange="${sable_version_range}"
    ordering="AFTER"
    side="BOTH"
